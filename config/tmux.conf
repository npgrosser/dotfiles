# Default shell
set-option -g default-shell /bin/zsh

# 256 color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Clipboard via OSC 52 (works in Codespaces / browser terminals)
set -g set-clipboard on
set -ga terminal-features ",*256col*:clipboard"

# Start indices at 1
set -g base-index 1
setw -g pane-base-index 1

# Mouse support disabled – native terminal selection works, use keyboard for tmux nav
# set -g mouse on

# Copy mode on Prefix+v ([ is awkward on German keyboard)
bind-key v copy-mode

# No delay for escape key
set -sg escape-time 0

# Smart auto-split (Alt+Shift+D): alternate between vertical and horizontal
# Creates a spiral-like layout (similar to Windows Terminal)
# Splits along the longer axis: wide panes split vertically, tall panes horizontally
# Factor ~3 accounts for character cell aspect ratio to get consistent alternation
bind-key -n M-D if-shell '[ $((#{pane_width})) -gt $((#{pane_height} * 3)) ]' \
  'split-window -h -c "#{pane_current_path}"' \
  'split-window -v -c "#{pane_current_path}"'

# Navigate panes with Ctrl+Shift+Arrow (no prefix)
bind-key -n C-S-Left  select-pane -L
bind-key -n C-S-Right select-pane -R
bind-key -n C-S-Up    select-pane -U
bind-key -n C-S-Down  select-pane -D

# Resize panes with Alt+Shift+Arrow
bind-key -n M-S-Left  resize-pane -L 5
bind-key -n M-S-Right resize-pane -R 5
bind-key -n M-S-Up    resize-pane -U 5
bind-key -n M-S-Down  resize-pane -D 5

# Minimal status bar
set -g status-style "bg=default,fg=colour248"
set -g status-left ""
set -g status-right "#h"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "fg=white,bold"
set -g status-right-length 30
