# Default shell
set-option -g default-shell /bin/zsh

# 256 color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Start indices at 1
set -g base-index 1
setw -g pane-base-index 1

# Mouse support
set -g mouse on

# No delay for escape key
set -sg escape-time 0

# Smart auto-split (Alt+D): vertical if pane is wide, horizontal if tall
bind-key -n M-D if-shell '[ #{pane_width} -gt $((#{pane_height} * 2)) ]' \
  'split-window -h -c "#{pane_current_path}"' \
  'split-window -v -c "#{pane_current_path}"'

# Navigate panes with Alt+Arrow (no prefix)
bind-key -n M-Left  select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up    select-pane -U
bind-key -n M-Down  select-pane -D

# Resize panes with Alt+Shift+Arrow
bind-key -n M-S-Left  resize-pane -L 5
bind-key -n M-S-Right resize-pane -R 5
bind-key -n M-S-Up    resize-pane -U 5
bind-key -n M-S-Down  resize-pane -D 5
