# Default shell
set-option -g default-shell /bin/zsh

# 256 color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Start indices at 1
set -g base-index 1
setw -g pane-base-index 1

# Mouse support
set -g mouse on

# No delay for escape key
set -sg escape-time 0

# Smart auto-split (Alt+Shift+D): vertical if two 80-col panes fit, else horizontal
bind-key -n M-D if-shell '[ #{pane_width} -ge 170 ]' \
  'split-window -h -c "#{pane_current_path}"' \
  'split-window -v -c "#{pane_current_path}"'

# Navigate panes with Ctrl+Alt+Arrow (no prefix)
bind-key -n C-M-Left  select-pane -L
bind-key -n C-M-Right select-pane -R
bind-key -n C-M-Up    select-pane -U
bind-key -n C-M-Down  select-pane -D

# Resize panes with Alt+Shift+Arrow
bind-key -n M-S-Left  resize-pane -L 5
bind-key -n M-S-Right resize-pane -R 5
bind-key -n M-S-Up    resize-pane -U 5
bind-key -n M-S-Down  resize-pane -D 5

# Minimal status bar
set -g status-style "bg=default,fg=colour248"
set -g status-left ""
set -g status-right "#h"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "fg=white,bold"
set -g status-right-length 30
